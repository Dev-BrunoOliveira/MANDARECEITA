<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Crie sua conta no Manda Receita e comece a compartilhar suas receitas favoritas!" />
    <title>Criar Conta - Manda Receita</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="style_index.css" />
  </head>
  <body>
    <div id="toast-container"></div>

    <div class="login-container">
      <div class="background-section">
        <div class="overlay-particles"></div>
        <div class="welcome-text">
          <div class="logo-badge">🍳</div>
          <h1>Junte-se à nossa <br />comunidade de cozinheiros!</h1>
          <p>Compartilhe suas criações e inspire-se.</p>
          <div class="features-list">
            <div class="feature-item">
              <i class="fas fa-user-circle"></i>
              <span>Crie seu perfil</span>
            </div>
            <div class="feature-item">
              <i class="fas fa-utensils"></i>
              <span>Compartilhe receitas</span>
            </div>
            <div class="feature-item">
              <i class="fas fa-users"></i>
              <span>Conecte-se</span>
            </div>
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="form-box">
          <div class="logo-container">
            <span class="logo-icon">🍳</span>
            <h2>Manda Receita</h2>
          </div>
          <h3>Crie sua conta</h3>

          <form id="registerForm">
            <div class="input-group">
              <label for="fullName">Nome Completo</label>
              <div class="input-wrapper">
                <i class="fas fa-user input-icon"></i>
                <input
                  type="text"
                  id="fullName"
                  name="fullName"
                  placeholder="Seu nome completo"
                  required
                />
              </div>
            </div>
            <div class="input-group">
              <label for="email">Email</label>
              <div class="input-wrapper">
                <i class="fas fa-envelope input-icon"></i>
                <input
                  type="email"
                  id="email"
                  name="email"
                  placeholder="seu@email.com"
                  required
                />
              </div>
            </div>
            <div class="input-group">
              <label for="password">Senha</label>
              <div class="input-wrapper">
                <i class="fas fa-lock input-icon"></i>
                <input
                  type="password"
                  id="password"
                  name="password"
                  placeholder="Mínimo 6 caracteres"
                  required
                />
                <span
                  class="toggle-password"
                  onclick="togglePasswordVisibility('password', 'toggleIconPassword')"
                >
                  <i id="toggleIconPassword" class="fas fa-eye"></i>
                </span>
              </div>
            </div>
            <div class="input-group">
              <label for="confirmPassword">Confirmar Senha</label>
              <div class="input-wrapper">
                <i class="fas fa-lock input-icon"></i>
                <input
                  type="password"
                  id="confirmPassword"
                  name="confirmPassword"
                  placeholder="Confirme sua senha"
                  required
                />
                <span
                  class="toggle-password"
                  onclick="togglePasswordVisibility('confirmPassword', 'toggleIconConfirmPassword')"
                >
                  <i id="toggleIconConfirmPassword" class="fas fa-eye"></i>
                </span>
              </div>
            </div>

            <div class="terms-register">
              <input type="checkbox" id="agreeTerms" name="agreeTerms" required />
              <label for="agreeTerms" class="checkbox-label">
                Eu li e concordo com os
                <a href="#" target="_blank">Termos de Serviço</a> e a
                <a href="#" target="_blank">Política de Privacidade</a>.
              </label>
            </div>

            <button type="submit" class="btn btn-login">
              <span>Criar Conta</span>
              <i class="fas fa-arrow-right"></i>
            </button>
          </form>

          <div class="separator">
            <span>OU</span>
          </div>

          <button type="button" class="btn btn-google" id="googleSignUpButton">
            <svg class="google-icon" viewBox="0 0 24 24" width="20" height="20">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Cadastre-se com o Google
          </button>

          <hr class="form-divider" />

          <div class="signup-link">
            Já tem uma conta? <a href="index.html">Faça login</a>
          </div>
        </div>
      </div>
    </div>

    <script src="script_register.js"></script>
  </body>
</html>
